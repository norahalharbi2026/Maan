<title>معًا عن بُعد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: sticky top bar + right-hand course map (RTL) + reading column; mobile: map becomes a drawer */
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --surface2:#EEEDF7; --ink:#22213A; --body:#4E4C6E; --muted:#77759A; --line:#E3E2F0;
  --indigo:#2A2770; --violet:#4B4FB8; --violetL:#E7E7F7; --teal:#11798A; --tealL:#E3F4F7; --green:#1F7A53; --greenL:#DDF2E8;
  --gold:#E8A93B; --goldD:#9A6510; --goldL:#FCF0D9; --coral:#B4502F; --coralL:#FBEDE8;
  --hero:#2A2770; --heroInk:#F6F5FB; --shadow:0 6px 20px rgba(42,39,112,.08);
  --f-display:'El Messiri',Tahoma,serif; --f-body:'Tajawal',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14132B; --surface:#1D1C3A; --surface2:#262548; --ink:#EDECF8; --body:#C3C2DD; --muted:#9897B8; --line:#33325A;
  --indigo:#C9CAF5; --violet:#9EA1F0; --violetL:#2C2B57; --teal:#5CC6D6; --tealL:#173B45; --green:#5FC798; --greenL:#183A2D;
  --gold:#F0BC5E; --goldD:#F0BC5E; --goldL:#3A2E14; --coral:#F09A7C; --coralL:#3D2219;
  --hero:#211F55; --heroInk:#F6F5FB; --shadow:0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14132B; --surface:#1D1C3A; --surface2:#262548; --ink:#EDECF8; --body:#C3C2DD; --muted:#9897B8; --line:#33325A;
  --indigo:#C9CAF5; --violet:#9EA1F0; --violetL:#2C2B57; --teal:#5CC6D6; --tealL:#173B45; --green:#5FC798; --greenL:#183A2D;
  --gold:#F0BC5E; --goldD:#F0BC5E; --goldL:#3A2E14; --coral:#F09A7C; --coralL:#3D2219;
  --hero:#211F55; --heroInk:#F6F5FB; --shadow:0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75;direction:rtl;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero)}
a{color:var(--violet)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:var(--heroInk);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:20px;white-space:nowrap}
.prog{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:0}
.bar{width:min(220px,30vw);height:8px;border-radius:9px;background:rgba(246,245,251,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#E8A93B;border-radius:9px;transition:width .5s;margin-right:0;margin-left:auto}
.prog span{font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.menuBtn{display:none;background:rgba(246,245,251,.12);color:var(--heroInk);border:0;border-radius:10px;padding:8px 12px;font-size:15px}

/* shell */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;
  padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.map{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.map h4{font-family:var(--f-body);font-size:13px;letter-spacing:.3px;color:var(--muted);margin:14px 8px 6px;font-weight:800}
.map h4:first-child{margin-top:4px}
.map a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.4}
.map a:hover{background:var(--surface2)}
.map a.on{background:var(--violetL);color:var(--violet);font-weight:700}
.map .dot{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.map a.done .dot{background:var(--green);border-color:var(--green);color:#fff}
main{min-width:0}
main:focus{outline:none}
.view{animation:inR .45s ease both}
@keyframes inR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.view,.rv{animation:none!important}.bar i{transition:none}}

/* home */
.hero{background:var(--hero);color:var(--heroInk);border-radius:26px;padding:34px 30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:-90px;bottom:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#E8A93B 0 30%,transparent 31%),radial-gradient(circle,rgba(75,79,184,.6) 0 60%,transparent 61%);opacity:.55}
.hero .k{color:#E8A93B;font-weight:800;font-size:15px}
.hero h1{font-size:clamp(34px,6vw,54px);margin:6px 0 10px;color:var(--heroInk)}
.hero p{max-width:60ch;margin:0;color:#DCDDF6;position:relative;z-index:1}
.people{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;font-size:15px;color:#DCDDF6;position:relative;z-index:1}
.people b{color:var(--heroInk);font-family:var(--f-display);font-size:17px}
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.stage:hover{border-color:var(--violet)}
.stage .n{font-family:var(--f-display);font-size:15px;font-weight:700}
.stage h3{font-size:22px}
.stage p{margin:0;color:var(--body);font-size:15px}
.stage .meter{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:auto}
.stage .meter i{display:block;height:100%;width:0;margin-left:auto}
.s1 .n{color:var(--violet)} .s1 .meter i{background:var(--violet)}
.s2 .n{color:var(--teal)} .s2 .meter i{background:var(--teal)}
.s3 .n{color:var(--goldD)} .s3 .meter i{background:var(--gold)}
.how{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.how ol{margin:8px 0 0;padding-right:22px}

/* unit page */
.crumb{font-size:14px;color:var(--muted);font-weight:700}
.uhead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.uhead h1{font-size:clamp(28px,4.5vw,40px);color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);color:var(--body);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:700}
.goal{background:var(--violetL);border-radius:16px;padding:14px 18px;color:var(--ink);margin-bottom:22px}
.goal b{color:var(--violet)}
.sec{margin:26px 0}
.sec h2{font-size:24px;margin-bottom:10px;color:var(--ink)}
.sec p{margin:0 0 10px;max-width:68ch;color:var(--body)}
.rv{animation:inR .6s ease both}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card h3{font-size:19px;margin-bottom:6px}
.card p{margin:0;font-size:15.5px;color:var(--body)}
.card .tag{font-size:13px;font-weight:800;margin-bottom:4px;display:block}
.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;margin-bottom:10px}
.c-v{background:var(--violetL);color:var(--violet)} .c-t{background:var(--tealL);color:var(--teal)} .c-g{background:var(--greenL);color:var(--green)} .c-o{background:var(--goldL);color:var(--goldD)} .c-r{background:var(--coralL);color:var(--coral)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.cmp>div{padding:16px 18px}
.cmp .a{background:var(--surface2)} .cmp .b{background:var(--tealL)}
.cmp h3{font-size:18px;margin-bottom:8px}
.cmp ul{margin:0;padding-right:20px;color:var(--body);font-size:15.5px}
.cmp .b h3{color:var(--teal)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1.4fr);align-items:center;gap:8px;margin-bottom:10px}
.pair .q{background:var(--goldL);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15.5px}
.pair .s{background:var(--greenL);border-radius:12px;padding:10px 14px;font-size:15.5px}
.pair .ar{color:var(--muted);text-align:center;font-size:20px}
.pair small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--body)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--gold);color:#2A2770;font-weight:800;display:grid;place-items:center;font-size:15px}
.steps li b{color:var(--ink)}
.quote{border-radius:18px;background:var(--hero);color:var(--heroInk);padding:20px 22px;font-size:17px;position:relative}
.quote::before{content:"”";position:absolute;right:14px;top:-18px;font-family:var(--f-display);font-size:74px;color:#E8A93B;opacity:.7}
.quote p{margin:0;padding-right:24px;color:#E7E7F7}
.tip{border-radius:16px;padding:14px 18px;background:var(--greenL);color:var(--ink)}
.tip b{color:var(--green)}
.warn{border-radius:16px;padding:14px 18px;background:var(--goldL);color:var(--ink)}
.warn b{color:var(--goldD)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th{background:var(--indigo);color:var(--bg);text-align:right;padding:10px 12px;font-weight:700}
:root[data-theme="dark"] th{color:#14132B}
td{padding:9px 12px;border-top:1px solid var(--line);color:var(--body);vertical-align:top}
td:first-child{font-weight:700;color:var(--ink)}
tr:nth-child(even) td{background:var(--surface2)}
.formula{display:flex;flex-direction:row;height:56px;border-radius:14px;overflow:hidden;margin-bottom:12px}
.formula div{display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--violetL);color:var(--violet);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14.5px}

/* reflect + quiz */
.reflect{background:var(--surface);border:2px dashed var(--violet);border-radius:18px;padding:18px}
.reflect h2{font-size:20px;color:var(--violet)}
textarea{width:100%;min-height:96px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;resize:vertical}
.saved{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}
.quiz{display:flex;flex-direction:column;gap:14px}
.qq{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.qq .qt{font-weight:800;margin-bottom:10px;color:var(--ink)}
.opt{display:block;width:100%;text-align:right;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:16px;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--violet)}
.opt.ok{border-color:var(--green);background:var(--greenL)}
.opt.no{border-color:var(--coral);background:var(--coralL)}
.opt[disabled]{cursor:default}
.why{margin-top:10px;font-size:15.5px;color:var(--body);border-right:4px solid var(--green);padding-right:12px}
.why.bad{border-right-color:var(--coral)}
.score{font-weight:800;color:var(--violet)}

/* nav footer */
.pager{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.main{background:var(--violet);color:#fff}
:root[data-theme="dark"] .btn.main{color:#14132B}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.done{background:var(--green);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.main,:root:not([data-theme="light"]) .btn.done{color:#14132B} :root:not([data-theme="light"]) th{color:#14132B}}

/* mock screens (illustrations of Teams; fixed screen palette, readable in both themes) */
.mockwrap{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.mock{container-type:inline-size;position:relative;width:100%;aspect-ratio:16/10.4;border-radius:12px;overflow:hidden;background:#F3F2FA;font-family:var(--f-body);direction:rtl;box-shadow:inset 0 0 0 1px #D9D8EA}
.mock *{position:absolute;margin:0}
.mock .b{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;font-size:2.15cqw;color:#2A2770;border-radius:1.2cqw;padding:0 .6cqw;overflow:hidden}
.m-bar{background:#2B2A4A!important;color:#E7E7F7!important;border-radius:0!important}
.m-rail{background:#33325A!important;border-radius:0!important}
.m-railicon{background:#5A59A0!important;border-radius:1cqw!important}
.m-btn{background:#3E3D66!important;color:#F6F5FB!important}
.m-btn.hl{background:#5B5FC7!important;box-shadow:0 0 0 .5cqw #E8A93B}
.m-red{background:#C4314B!important;color:#fff!important}
.m-panel{background:#FFFFFF!important;box-shadow:0 .4cqw 1.6cqw rgba(42,39,112,.18);border-radius:1.4cqw!important}
.m-row{background:#F1F0FA!important;justify-content:flex-start!important;padding-right:1.4cqw!important}
.m-row.hl{background:#E3E3FA!important;box-shadow:0 0 0 .4cqw #E8A93B}
.m-pbtn{background:#5B5FC7!important;color:#fff!important}
.m-pbtn.g{background:#2E9E6E!important}
.m-pbtn.o{background:#FFFFFF!important;color:#2A2770!important;box-shadow:inset 0 0 0 .3cqw #C9C8E3}
.m-tile{background:#2F2E52!important;color:#9C9BC4!important}
.m-tile.on{background:#46457A!important;color:#E7E7F7!important}
.m-title{background:transparent!important;font-weight:800;justify-content:flex-start!important;font-size:2.4cqw!important}
.m-text{background:transparent!important;justify-content:flex-start!important;color:#4E4C6E!important}
.m-input{background:#FFFFFF!important;box-shadow:inset 0 0 0 .3cqw #C9C8E3;justify-content:flex-start!important;padding-right:1.2cqw!important;color:#4E4C6E!important}
.m-note{color:#3A3460!important;font-size:1.7cqw!important;border-radius:.5cqw!important;box-shadow:0 .2cqw .6cqw rgba(0,0,0,.12)}
.n1{background:#FCE7BE!important}.n2{background:#D5F1E3!important}.n3{background:#DCDDF6!important}.n4{background:#FBD9CE!important}.n5{background:#CDEFF4!important}
.m-area{background:#FFFFFF!important;box-shadow:inset 0 0 0 .3cqw #D9D8EA}
.m-tab{background:transparent!important;color:#4E4C6E!important}
.m-tab.hl{color:#5B5FC7!important;font-weight:800;box-shadow:inset 0 -.5cqw 0 #5B5FC7,0 0 0 .4cqw #E8A93B}
.m-bar2{background:#FFFFFF!important;border-radius:0!important;box-shadow:0 .2cqw .6cqw rgba(42,39,112,.1)}
.m-chart{background:#5B5FC7!important;border-radius:.5cqw .5cqw 0 0!important}
.pin{width:5.4cqw;height:5.4cqw;border-radius:50%;background:#E8A93B;color:#2A2770;font-weight:800;font-size:2.9cqw;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .6cqw rgba(232,169,59,.35),0 .4cqw 1cqw rgba(0,0,0,.25);z-index:5;transform:translate(50%,-50%)}
.cap{font-size:13.5px;color:var(--muted);margin-top:10px}

/* tasks */
.task{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.task h3{font-size:21px;margin-bottom:4px}
.task .what{background:var(--surface2);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15.5px;color:var(--body)}
.task ul{margin:6px 0 0;padding-right:20px;color:var(--body);font-size:15.5px}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;color:var(--ink);min-width:0}
.fld input,.fld select{font:inherit;font-weight:500;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;width:100%}
.fld textarea{margin-top:0}
.chip.c-o,.chip.c-v,.chip.c-g,.chip.c-t{font-weight:800}
body.locked nav.map,body.locked .prog,body.locked .menuBtn{display:none}
body.locked .shell{grid-template-columns:minmax(0,1fr);max-width:760px}
.gsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gsteps div{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;font-size:14.5px;color:var(--muted)}
.gsteps span{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:13px}
.gsteps .ok{color:var(--green)} .gsteps .ok span{background:var(--green);color:#fff}
.gsteps .cur{color:var(--violet);border-color:var(--violet)} .gsteps .cur span{background:var(--violet);color:#fff}
@media (max-width:560px){.gsteps div{flex-direction:column;text-align:center;font-size:13px}}
.btn.wa{background:#1F8A55;color:#fff}
.foot{background:var(--hero);color:#DCDDF6;margin-top:10px;padding:26px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.footIn{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:center}
.fBrand{display:flex;flex-direction:column;gap:4px;font-size:15px}
.fBrand b{font-family:var(--f-display);font-size:22px;color:#F6F5FB}
.fPeople{display:grid;gap:10px}
.fp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:rgba(246,245,251,.08);border-radius:14px;padding:10px 14px}
.fp b{color:#F6F5FB;font-family:var(--f-display);font-size:17px;flex:1;min-width:150px}
.fnum{color:#E8A93B;font-weight:800;font-size:18px;text-decoration:none;font-variant-numeric:tabular-nums}
.fwa{background:#1F8A55;color:#fff;border-radius:99px;padding:4px 14px;font-weight:800;font-size:14px;text-decoration:none}
.fSmall{max-width:1240px;margin:16px auto 0;padding-top:12px;border-top:1px solid rgba(246,245,251,.15);font-size:13.5px}
.fSmall a{color:#E8A93B}
@media (max-width:900px){.footIn{grid-template-columns:minmax(0,1fr)}}
.steps.shots li>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.steps.shots img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;font-size:16px;color:var(--body)}
.check input{width:20px;height:20px;margin-top:4px;accent-color:#2E9E6E;flex:none}

function block(b,i){

   case "sec": return `<section class="sec rv" ${d}>${H}${b.p.map(p=>`<p>${p}</p>`).join("")}</section>`;
   case "cmp": return `<section class="sec rv" ${d}>${H}<div class="cmp"><div class="a"><h3>العمل الجماعي التقليدي</h3><ul>${b.a.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="b"><h3>التعلم التعاوني</h3><ul>${b.b.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></section>`;

   case "quote": return `<section class="sec rv" ${d}>${H}<div class="quote"><p>${b.text}</p></div></section>`;
   case "tip": return `<section class="sec rv" ${d}><div class="tip">${b.text}</div></section>`;

   case "strats": return `<section class="sec rv" ${d}>${H}<div class="grid g2">${b.items.map(([t,p,c],k)=>`<div class="card"><div class="num ${c}">${k+1}</div><h3>${t}</h3><p>${p}</p></div>`).join("")}</div></section>`;
   case "pairs": return `<section class="sec rv" ${d}>${H}${b.items.map(([q,c,s])=>`<div class="pair"><div class="q"><small>${c}</small>${q}</div><div class="ar">←</div><div class="s">${s}</div></div>`).join("")}</section>`;
   case "table": return `<section class="sec rv" ${d}>${H}<div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;

      <div class="grid g4"><div class="card"><span class="tag" style="color:var(--teal)">50%</span><h3>منتج المجموعة</h3><p>بسلم التقدير</p></div><div class="card"><span class="tag" style="color:var(--violet)">30%</span><h3>أداء فردي</h3><p>سؤال عشوائي أو اختبار قصير</p></div><div class="card"><span class="tag" style="color:var(--green)">15%</span><h3>تقييم الأقران</h3><p>نموذج Forms</p></div><div class="card"><span class="tag" style="color:var(--goldD)">5%</span><h3>التقييم الذاتي</h3><p>سؤال تأمل قصير</p></div></div></section>`;

function bindForm(){

    const items=Object.assign({},MY.items||{}); items[fd.get("task")]={desc:fd.get("desc").trim(),link,at:Date.now()};
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true; msg.textContent="جارٍ الإرسال…";
    try{await DB.doc("subs/"+ME).set({name:fd.get("name").trim(),subject:fd.get("subject").trim(),stage:fd.get("stage"),updatedAt:Date.now(),items});
      msg.textContent="وصل تسليمك ✓ ستظهر ملاحظات المدربتين أدناه"; f.desc.value=""; f.link.value="";}

}

function route(){
  let id=(location.hash||"#home").slice(1);
  if(!(id==="home"||id==="about"||ORDER.includes(id))) id="home";
  const main=$("#main");
  GATEKEY=gateKey(); document.body.classList.toggle("locked",GATEKEY!=="open");
  if(GATEKEY!=="open"){ main.innerHTML=gateView(GATEKEY); bindReg(); document.title="منصة معًا عن بُعد"; return; }
  if(id==="admin"){ main.innerHTML=adminView(); renderAdmin(); $("#fTask").onchange=renderAdmin; $("#fStat").onchange=renderAdmin; renderMap(id); closeMap(); document.title="لوحة التسليمات · معًا عن بُعد"; return; }
  if(id==="about") main.innerHTML=aboutView();
  else if(id==="home") main.innerHTML=homeView();
  else if(id==="tasks") main.innerHTML=tasksView();
  else if(id.startsWith("u")) main.innerHTML=unitView(UNITS.find(u=>u.id===id),UNITS.findIndex(u=>u.id===id));
  else main.innerHTML=guideView(GUIDES.find(g=>g.id===id),GUIDES.findIndex(g=>g.id===id));
  renderMap(id); bind(id); closeMap();
  window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});
  try{main.focus({preventScroll:true});}catch(e){}
  document.title = id==="home" ? "منصة معًا عن بُعد" : TITLE(id)+" · معًا عن بُعد";
}
function bind(id){
  const db=$("#doneBtn");
  if(db) db.onclick=()=>{S.done[id]=!S.done[id]; save(); renderMap(id); db.className="btn "+(S.done[id]?"done":"main"); db.textContent=S.done[id]?"✓ أنهيتِ هذا الجزء":"أنهيت هذا الجزء";};
  const ta=document.getElementById("note-"+id);
  if(ta){let t; ta.oninput=()=>{clearTimeout(t); t=setTimeout(()=>{S.notes[id]=ta.value; save(); $("#saved").textContent="حُفظت في متصفحك";},400);};}
  const u=UNITS.find(x=>x.id===id);
  if(u){
    const score=()=>{const qs=S.quiz[id]||{}; const k=Object.keys(qs); if(k.length) $("#score").textContent=`· ${k.filter(i=>qs[i]===u.quiz[i].a).length} من ${u.quiz.length}`;};
    score();
    document.querySelectorAll(".qq").forEach(box=>{
      const k=+box.dataset.k, q=u.quiz[k];
      box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const j=+b.dataset.j; S.quiz[id]=S.quiz[id]||{}; S.quiz[id][k]=j; save();
        box.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true; if(i===q.a)x.classList.add("ok"); else if(i===j)x.classList.add("no");});
        box.insertAdjacentHTML("beforeend",`<div class="why ${j===q.a?'':'bad'}"><b>${j===q.a?'إجابة صحيحة.':'ليست هذه.'}</b> ${q.w}</div>`);
        score();
      });
    });
  }
  document.querySelectorAll('.check input').forEach(c=>c.onchange=()=>{S.checks[c.id.slice(3)]=c.checked; save();});
}
